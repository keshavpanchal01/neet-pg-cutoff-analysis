name: Build and deploy site

# Runs on every commit, so a new 1.csv / all.csv is picked up automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble the public site (1.csv is published for the page; all.csv stays private - the page uses the derived choice-data.json)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='_site' --exclude='all.csv' --exclude='match-report.txt' --exclude='integrity-report.txt' ./ _site/

      - name: Generate choice-data.json from all.csv
        run: node scripts/build-choice-data.mjs --out _site/choice-data.json --report match-report.txt

      - name: Integrity checks (CSV structure, matching, column mapping) - stops the deploy if anything fails
        run: node scripts/verify-integrity.mjs --json _site/choice-data.json --report match-report.txt --out integrity-report.txt

      - name: Keep the match and integrity reports (private to this repository)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            match-report.txt
            integrity-report.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
