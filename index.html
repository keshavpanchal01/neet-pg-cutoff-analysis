<style>
:root{
  --bg:#0a0a0a; --bg2:#141414; --card:#181818; --card2:#1f1f1f; --line:#2c2c2c; --line2:#3a3a3a;
  --txt:#f5f5f1; --mut:#a3a3a3; --dim:#6b6b6b; --red:#e50914; --red2:#b20710; --redglow:rgba(229,9,20,.35); --ok:#46d369;
  --font:"Netflix Sans","Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(229,9,20,.12),transparent 60%),var(--bg);color:var(--txt);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.nav{position:sticky;top:0;z-index:50;background:linear-gradient(#000e,#000a);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;min-height:60px;flex-wrap:wrap}
.logo{font-weight:900;letter-spacing:.14em;color:var(--red);font-size:20px;text-transform:uppercase;white-space:nowrap}
.logo small{color:var(--txt);font-weight:600;letter-spacing:.08em;font-size:12px;margin-left:10px;opacity:.8}
.tabs{display:flex;gap:6px}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--mut);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:18px 12px 15px;transition:.15s}
.tab:hover{color:var(--txt)}
.tab[aria-selected=true]{color:#fff;border-color:var(--red)}
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(28px,4.4vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--red)}
.msg{flex-basis:100%;font-size:13.5px;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--line2);background:#111}
.msg.ok{border-color:#2a6b3a;background:#0f1d13;color:#9be7ae}
.msg.err{border-color:var(--red2);background:#240c0e;color:#ffb3b7}
.msg small{display:block;font-weight:500;color:var(--mut);margin-top:3px}
/* view */
.view{margin:26px 0 10px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:8px 24px 28px}
.group{margin-top:20px}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ghead h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.ghead .cnt{font-size:12px;color:var(--red);font-weight:700}
.ghead .acts{margin-left:auto;display:flex;gap:6px}
.mini{background:transparent;border:1px solid var(--line2);color:var(--mut);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;transition:.15s}
.mini:hover{color:var(--txt);border-color:var(--txt)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:7px}
.chip{background:var(--card2);border:1px solid var(--line2);color:#d6d6d6;border-radius:8px;padding:8px 9px;min-height:40px;font-size:12px;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:7px;text-align:left;overflow-wrap:break-word;min-width:0;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
.chip:hover{border-color:#777;transform:translateY(-1px)}
.chip:focus-visible,.mini:focus-visible,.seg button:focus-visible,.sortbtn button:focus-visible,.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 16px var(--redglow)}
.chip[aria-pressed=true]::before{content:"✓";font-weight:900;font-size:11px;flex:none}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px}
.seg button{background:transparent;border:0;padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut);transition:.15s}
.seg button[aria-pressed=true]{background:var(--txt);color:#000}
/* cutoff cards */
.sumrow{margin-top:26px;display:flex;gap:18px 30px;flex-wrap:wrap;align-items:flex-start}
.sumrow div{font-size:13px}
.sumrow b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.tag{display:inline-block;background:#2a2a2a;border:1px solid var(--line2);border-radius:5px;padding:1px 8px;margin:0 4px 4px 0;font-size:12.5px;font-weight:600}
.tag.r{background:rgba(229,9,20,.16);border-color:var(--red2);color:#ffb3b7}

.card{border-radius:14px;border:1px solid var(--line2);background:radial-gradient(600px 220px at 0% 0%,rgba(229,9,20,.16),transparent 70%),#101010;padding:22px 24px}

.chead h3{font-size:16px;font-weight:800;letter-spacing:.03em}
.lab{font-size:11.5px;letter-spacing:.16em;color:var(--mut);font-weight:700;text-transform:uppercase;margin-top:14px}
.big{font-size:clamp(50px,8vw,88px);font-weight:900;letter-spacing:-.03em;line-height:1;margin:6px 0 2px;text-shadow:0 0 40px var(--redglow)}
.big.none{font-size:clamp(26px,4vw,38px);color:var(--red);text-shadow:none;letter-spacing:0;line-height:1.1}
.rec{margin-top:10px;padding:12px 14px;background:#161616;border:1px solid var(--line);border-radius:10px}
.inst{font-size:16px;font-weight:700;line-height:1.35;white-space:normal;word-break:break-word;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:86px 1fr;gap:5px 12px;margin-top:8px;font-size:13px}
.kv dt{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px;font-weight:700}
.kv dd{font-weight:600;word-break:break-word}
.sub{color:var(--mut);font-size:13px;margin-top:10px}
/* scatter */
.chartcard{margin-top:22px;background:#101010;border:1px solid var(--line);border-radius:14px;padding:16px 14px 10px;position:relative}
.charthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 8px 8px}
.charthead .t{font-weight:700;font-size:14px}
.charthead .s{color:var(--mut);font-size:12.5px}
.sortbtn{margin-left:auto;display:inline-flex}
.sortbtn button{background:var(--card2);border:1px solid var(--line2);padding:5px 11px;font-size:12px;font-weight:700;color:var(--mut)}
.sortbtn button:first-child{border-radius:8px 0 0 8px}.sortbtn button:last-child{border-radius:0 8px 8px 0}
.sortbtn button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
#plot{width:100%;display:block}

.tip{position:absolute;pointer-events:none;z-index:20;background:#000;border:1px solid var(--red);border-radius:10px;padding:11px 14px;font-size:12.5px;min-width:190px;max-width:300px;box-shadow:0 10px 40px #000c;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip .n{font-weight:800;font-size:14px}
.tip .r{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:2px 0 6px}
.tip .m{color:var(--mut);line-height:1.5;overflow-wrap:anywhere}
.note{color:var(--dim);font-size:12.5px;padding:8px 10px 6px}
.nodata{padding:30px;text-align:center;color:var(--red);font-weight:800;font-size:20px}
@media(max-width:600px){
  .chip{overflow-wrap:anywhere}
  .wrap{padding:0 12px}

.rounds{margin-top:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.rlab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800}
.rbtns{display:flex;gap:10px;flex-wrap:wrap}
.rbtn{background:var(--card2);border:1px solid var(--line2);color:#d6d6d6;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:800;letter-spacing:.03em;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
.rbtn:hover{border-color:#777;transform:translateY(-1px)}
.rbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.rbtn[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 22px var(--redglow)}
.view{margin-bottom:60px}
@media(max-width:600px){.rbtn{padding:10px 20px}}
/* contact popover (nav) */
.cwrap{position:relative}
.contactbtn{text-transform:uppercase;letter-spacing:.06em;font-size:12px;padding:6px 14px}
.cpop{position:absolute;top:calc(100% + 10px);left:0;z-index:60;display:flex;flex-direction:column;gap:10px;min-width:260px;max-width:calc(100vw - 24px);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:12px;box-shadow:0 10px 40px #000c}
.cpop a{display:inline-flex;flex-direction:column;gap:1px;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;transition:.15s;overflow-wrap:anywhere}
.cpop a span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}
.cpop a:hover{border-color:var(--red);box-shadow:0 4px 18px var(--redglow);transform:translateY(-1px)}
.cpop a:focus-visible,.contactbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* dropdown chips */
.dd{position:relative;min-width:0}
.dd>.chip{width:100%}
.dd>.chip::after{content:"▾";margin-left:auto;font-size:11px;opacity:.8;flex:none}
.ddm{position:absolute;left:0;top:calc(100% + 6px);z-index:40;width:max-content;min-width:100%;max-width:min(340px,calc(100vw - 24px));max-height:320px;overflow-y:auto;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 10px 40px #000c;display:flex;flex-direction:column;gap:5px}
.ddm .chip{width:100%}
.ddsearch{position:sticky;top:0;z-index:1;width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12px;font-weight:600;color:var(--txt)}
.ddsearch:focus-visible{outline:2px solid #fff;outline-offset:1px}
.ddnone{padding:8px 10px;font-size:12px;color:var(--mut)}
/* top-10 ranks */
.rkrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rk{background:var(--card2);border:1px solid var(--line2);color:#d6d6d6;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;transition:.15s}
.rk:hover{border-color:#777}
.rk:focus-visible{outline:2px solid #fff;outline-offset:2px}
.rk[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
</style>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= CSV PARSING (RFC 4180, local) ================= */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const nl=text.search(/\r|\n/), first=nl<0?text:text.slice(0,nl);
  const cnt=ch=>{let n=0,q=false;for(const c of first){if(c==='"')q=!q;else if(!q&&c===ch)n++;}return n;};
  let delim=',';const cands=[',','\t',';'];let best=-1;
  for(const d of cands){const n=cnt(d);if(n>best){best=n;delim=d;}}
  const rows=[];let row=[],f='',inQ=false,i=0;const L=text.length;
  while(i<L){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue;}inQ=false;i++;continue;}
      f+=c;i++;continue;
    }
    if(c==='"'&&f===''){inQ=true;i++;continue;}
    if(c===delim){row.push(f);f='';i++;continue;}
    if(c==='\r'||c==='\n'){
      row.push(f);f='';
      if(row.length>1||row[0].trim()!=='')rows.push(row);
      row=[];if(c==='\r'&&text[i+1]==='\n')i++;i++;continue;
    }
    f+=c;i++;
  }
  if(f!==''||row.length){row.push(f);if(row.length>1||row[0].trim()!=='')rows.push(row);}
  return rows;
}

/* ================= COURSE CLASSIFICATION =================
   RAWMAP lists every distinct course name found in the supplied CSV and the qualification group
   (M = MD / MS / DNB, D = Diploma) and speciality it belongs to. It is used for grouping only;

const KEY=s=>s.toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
// Fallback for a course name that is not in RAWMAP (e.g. appears only in a future round): a whole-word DIPLOMA
// in the name makes it a Diploma course; everything else is MD/MS/DNB. It is never merged into another speciality.
function normCourse(raw){
  const hit=RAWMAP[raw.trim()];
  if(hit)return {t:hit[0],n:hit[1],known:true};
  const k=KEY(raw);
  const dip=/\bDIPLOMA\b/.test(k);
  const n=k.replace(/^(?:(?:NBEMS|DNB|DIPLOMA|DIP|MD|MS|M D|M S)\s+)+/,'').replace(/ AND /g,' & ')||k;
  return {t:dip?'D':'M',n,known:false};
}
/* Interface-only grouping for the Cutoff page (the CSV is never altered): these course groups are treated as one speciality. */
const MERGE={'HOSPITAL ADMINISTRATION':'COMMUNITY HEALTH & HOSPITAL ADMINISTRATION','COMMUNITY HEALTH ADMINISTRATION':'COMMUNITY HEALTH & HOSPITAL ADMINISTRATION','NEURO SURGERY (DIRECT 6 YR)':'NEURO SURGERY','NEURO SURGERY (M.Ch.)':'NEURO SURGERY'};
const cmp=(a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'})||(a<b?-1:a>b?1:0);
const sortNames=arr=>[...arr].sort(cmp);
const disp=s=>String(s).replace(/NBEMS/gi,'DNB');   // display only: NBEMS is shown as DNB

/* ================= DATASET (only the latest valid upload) ================= */
let DS=null;   // {rank:Int32Array,q:Int32Array,c:Int32Array,course:Int32Array,inst:Int32Array,raw:Int32Array,quotas,cats,courses:[{t,n}],insts,raws,byCourse,n,file,time}
const HEAD={rank:/^rank$/,quota:/quota/,institute:/institute/,course:/^course/,category:/categor/};

function buildDataset(rows,fileName){
  if(rows.length<2)throw new Error('The file has no data rows.');
  const hdr=rows[0].map(h=>h.toLowerCase().replace(/[^a-z]/g,''));
  const idx={},missing=[];
  const names={rank:'Rank',quota:'Allotted Quota',institute:'Allotted Institute',course:'Course',category:'Allotted Category'};
  for(const k in HEAD){const i=hdr.findIndex(h=>HEAD[k].test(h));if(i<0)missing.push(names[k]);else idx[k]=i;}
  if(missing.length)throw new Error('Required column(s) missing: '+missing.join(', ')+'.',{cause:{found:rows[0]}});
  const total=rows.length-1;
  const qMap=new Map(),cMap=new Map(),iMap=new Map(),rMap=new Map(),crsMap=new Map(),mMap=new Map();
  const quotas=[],cats=[],insts=[],raws=[],courses=[],mcourses=[];
  const rank=new Int32Array(total),qa=new Int32Array(total),ca=new Int32Array(total),co=new Int32Array(total),ia=new Int32Array(total),ra=new Int32Array(total),cm=new Int32Array(total);
  let n=0,skippedRank=0,skippedField=0,unknown=new Set(),nonint=0;
  const intern=(map,arr,v)=>{let k=map.get(v);if(k===undefined){k=arr.length;arr.push(v);map.set(v,k);}return k;};
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    const rs=(row[idx.rank]||'').replace(/[,\s]/g,'');
    const q=(row[idx.quota]||'').trim(),inst=(row[idx.institute]||'').trim(),crs=(row[idx.course]||'').trim(),cat=(row[idx.category]||'').trim();
    if(!/^\d+(\.0+)?$/.test(rs)){skippedRank++;continue;}
    const rv=Number(rs);
    if(!(rv>0)){skippedRank++;continue;}
    if(!q||!cat||!crs){skippedField++;continue;}
    const nc=normCourse(crs);
    if(!nc.known)unknown.add(crs);
    const ck=nc.t+'|'+nc.n;
    let cid=crsMap.get(ck);if(cid===undefined){cid=courses.length;courses.push({t:nc.t,n:nc.n});crsMap.set(ck,cid);}
    const mn=(nc.t==='M'&&MERGE[nc.n])||nc.n,mk=nc.t+'|'+mn;
    let mid=mMap.get(mk);if(mid===undefined){mid=mcourses.length;mcourses.push({t:nc.t,n:mn});mMap.set(mk,mid);}
    rank[n]=rv;qa[n]=intern(qMap,quotas,q);ca[n]=intern(cMap,cats,cat);co[n]=cid;cm[n]=mid;
    ia[n]=intern(iMap,insts,inst||'Institute not specified');ra[n]=intern(rMap,raws,crs);n++;
  }
  if(n===0)throw new Error('No valid allotment records found (every row had an invalid Rank or a missing Quota/Category/Course).');
  const counts=new Int32Array(courses.length);for(let i=0;i<n;i++)counts[co[i]]++;
  const byCourse=courses.map((_,i)=>new Int32Array(counts[i]));const fill=new Int32Array(courses.length);
  for(let i=0;i<n;i++){const c=co[i];byCourse[c][fill[c]++]=i;}
  const mcounts=new Int32Array(mcourses.length);for(let i=0;i<n;i++)mcounts[cm[i]]++;
  const byMCourse=mcourses.map((_,i)=>new Int32Array(mcounts[i]));const mfill=new Int32Array(mcourses.length);
  for(let i=0;i<n;i++){const c=cm[i];byMCourse[c][mfill[c]++]=i;}
  return {rank:rank.subarray(0,n),q:qa,c:ca,course:co,inst:ia,raw:ra,quotas,cats,courses,insts,raws,byCourse,mcourses,byMCourse,n,total,skippedRank,skippedField,unknown:[...unknown],file:fileName,time:new Date()};
}

/* Closing rank = max Rank among matching records; all records tied at that rank are returned (same record -> same institute) */
function closing(ci,qs,cs,mg){
  const ds=DS,list=(mg?ds.byMCourse:ds.byCourse)[ci];let max=-1,cnt=0,hits=[];
  for(let k=0;k<list.length;k++){
    const i=list[k];
    if(qs.has(ds.q[i])&&cs.has(ds.c[i])){
      cnt++;const r=ds.rank[i];
      if(r>max){max=r;hits=[i];}else if(r===max)hits.push(i);
    }
  }
  return cnt?{max,cnt,hits}:null;
}
/* Top-N distinct allotted ranks (highest first) among matching records; every rank keeps its own matching records. Cutoff page only. */
function topRanks(ci,qs,cs,k){
  const ds=DS,list=ds.byMCourse[ci],by=new Map();
  for(let x=0;x<list.length;x++){
    const i=list[x];
    if(qs.has(ds.q[i])&&cs.has(ds.c[i])){const r=ds.rank[i],a=by.get(r);a?a.push(i):by.set(r,[i]);}
  }
  return [...by.keys()].sort((a,b)=>b-a).slice(0,k).map(r=>({rank:r,hits:by.get(r)}));
}

function chips(el,labels,isOn,toggle){
  el.innerHTML='';
  labels.forEach((label,i)=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=label;
    b.setAttribute('aria-pressed',isOn(i));
    b.onclick=()=>{toggle(i);b.setAttribute('aria-pressed',isOn(i));};
    el.appendChild(b);
  });
}
/* Same buttons as chips(), but only the indices in `main` are shown as buttons; the rest go in a multi-select dropdown (optionally searchable). */
function gchips(el,labels,isOn,toggle,main,moreLabel,search){
  const mainSet=new Set(main),rest=labels.map((_,i)=>i).filter(i=>!mainSet.has(i));
  if(!rest.length||!main.length){chips(el,labels,isOn,toggle);return;}
  el.innerHTML='';
  const mk=(parent,i)=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=labels[i];
    b.setAttribute('aria-pressed',isOn(i));
    b.onclick=()=>{toggle(i);b.setAttribute('aria-pressed',isOn(i));refresh();};
    parent.appendChild(b);return b;
  };
  main.forEach(i=>mk(el,i));
  const dd=document.createElement('div');dd.className='dd';
  const trig=document.createElement('button');trig.type='button';trig.className='chip';trig.setAttribute('aria-haspopup','true');trig.setAttribute('aria-expanded','false');
  const menu=document.createElement('div');menu.className='ddm';menu.hidden=true;
  let inp=null;const items=[];
  if(search){inp=document.createElement('input');inp.type='search';inp.className='ddsearch';inp.placeholder='Search…';inp.setAttribute('aria-label','Search '+moreLabel);menu.appendChild(inp);}
  rest.forEach(i=>items.push({i,b:mk(menu,i)}));
  const none=document.createElement('div');none.className='ddnone';none.textContent='No match';none.hidden=true;menu.appendChild(none);
  function refresh(){const n=rest.filter(isOn).length;trig.textContent=moreLabel+(n?' · '+n:'');trig.setAttribute('aria-pressed',n>0);}
  function filter(){const q=inp.value.trim().toLowerCase();let any=false;items.forEach(x=>{const m=!q||labels[x.i].toLowerCase().includes(q);x.b.hidden=!m;if(m)any=true;});none.hidden=any;}
  if(inp)inp.oninput=filter;
  trig.onclick=()=>{
    const open=menu.hidden;closeMenus();
    if(open){menu.hidden=false;trig.setAttribute('aria-expanded','true');menu.style.left='';menu.style.right='';
      const r=menu.getBoundingClientRect();if(r.right>innerWidth-8){menu.style.left='auto';menu.style.right='0';}
      if(inp){inp.value='';filter();inp.focus({preventScroll:true});}}
  };
  refresh();dd.append(trig,menu);el.appendChild(dd);
}
function closeMenus(){
  document.querySelectorAll('.ddm').forEach(m=>{m.hidden=true;const t=m.previousElementSibling;if(t)t.setAttribute('aria-expanded','false');});
}

const catMain=SC=>SC.map((x,i)=>i).filter(i=>!/pwd/i.test(SC[i]));

/* ================= CUTOFF VIEW ================= */
function courseIdsOf(t,mg){return (mg?DS.mcourses:DS.courses).map((c,i)=>({c,i})).filter(x=>x.c.t===t).sort((a,b)=>cmp(a.c.n,b.c.n));}
function buildCutoff(){
  const ds=DS;
  const SQ=sortNames(ds.quotas),SC=sortNames(ds.cats);
  gchips($('t-q'),SQ,i=>T.q.has(SQ[i]),i=>{T.q.has(SQ[i])?T.q.delete(SQ[i]):T.q.add(SQ[i]);renderCutoff();},quotaMain(SQ),'Other Quotas',false);
  gchips($('t-c'),SC,i=>T.c.has(SC[i]),i=>{T.c.has(SC[i])?T.c.delete(SC[i]):T.c.add(SC[i]);renderCutoff();},catMain(SC),'PwD',false);
  for(const [t,el] of [['M','t-m'],['D','t-d']]){
    const L=courseIdsOf(t,true);
    gchips($(el),L.map(x=>x.c.n),j=>T.courses.has(ckey(L[j].c)),j=>{const k=ckey(L[j].c);T.courses.has(k)?T.courses.delete(k):T.courses.add(k);renderCutoff();},L.map((_,j)=>j).slice(0,6),'More specialties',true);
  }
  renderCutoff();
}
function renderCutoff(){
  const ds=DS;
  $('t-qc').textContent=T.q.size+' selected';$('t-cc').textContent=T.c.size+' selected';
  for(const [t,id] of [['M','t-mc'],['D','t-dc']]){const L=courseIdsOf(t,true);$(id).textContent=L.filter(x=>T.courses.has(ckey(x.c))).length+' / '+L.length+' selected';}
  const out=$('t-out');
  const qs=idxSet(T.q,ds.quotas),cs=idxSet(T.c,ds.cats);
  const sel=ds.mcourses.map((c,i)=>({c,i})).filter(x=>T.courses.has(ckey(x.c)));
  if(!qs.size||!cs.size||!sel.length){out.innerHTML='';return;}
  const sig=[...qs].sort().join(',')+'|'+[...cs].sort().join(',');TOP=[];
  const tags=a=>[...a].map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  let html=`<div class="sumrow"><div><b>Quota</b>${tags([...qs].map(i=>ds.quotas[i]).sort(cmp))}</div><div><b>Category</b>${tags([...cs].map(i=>ds.cats[i]).sort(cmp))}</div></div><div class="cards">`;
  for(const {c,i} of sel){
    const r=closing(i,qs,cs,true);
    const type=c.t==='M'?'MD / MS / DNB':'DIPLOMA';
    html+=`<div class="card"><div class="chead"><span class="tag r">${type}</span><h3>${esc(c.n)}</h3></div>`;
    if(!r){html+=`<div class="lab">Closing rank</div><div class="big none">No Data Available</div></div>`;continue;}
    html+=`<div class="lab">Closing rank</div><div class="big">${fmt(r.max)}</div>`;
    html+=`<div class="lab">Allotted institute${r.hits.length>1?'s':''}</div>`;
    for(const h of r.hits)html+=recHTML(h);
    const nx=topRanks(i,qs,cs,10).slice(1);
    if(nx.length){
      const ti=TOP.length;TOP.push({key:ckey(c),sig,list:nx});
      html+=`<div class="lab">Next ${nx.length} highest allotted rank${nx.length===1?'':'s'}</div><div class="rkrow" data-ti="${ti}">`+nx.map((x,j)=>`<button type="button" class="rk" data-j="${j}" aria-pressed="false">${fmt(x.rank)}</button>`).join('')+`</div><div class="rkdet" hidden></div>`;
    }
    html+=`<div class="sub">${fmt(r.cnt)} matching allotment${r.cnt===1?'':'s'}</div></div>`;
  }
  out.innerHTML=html+'</div>';
  out.querySelectorAll('.rkrow').forEach(row=>{
    const t=TOP[+row.dataset.ti],p=T.pick.get(t.key);
    if(p&&p.sig===t.sig){const j=t.list.findIndex(x=>x.rank===p.rank);if(j>=0)openRank(row,t,j);}
  });
}
let TOP=[];
function recHTML(h){const ds=DS;
  return `<div class="rec"><div class="inst">${esc(ds.insts[ds.inst[h]])}</div><dl class="kv"><dt>Course</dt><dd>${esc(disp(ds.raws[ds.raw[h]]))}</dd><dt>Quota</dt><dd>${esc(ds.quotas[ds.q[h]])}</dd><dt>Category</dt><dd>${esc(ds.cats[ds.c[h]])}</dd></dl></div>`;}
function openRank(row,t,j){

const SVGNS='http://www.w3.org/2000/svg';

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p;}
function niceStep(range,target){const raw=range/target,p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10])if(m*p>=raw)return m*p;return 10*p;}

function buildScatter(){
  const ds=DS;
  const SQ=sortNames(ds.quotas),SC=sortNames(ds.cats);
  gchips($('s-q'),SQ,i=>S.q.has(SQ[i]),i=>{S.q.has(SQ[i])?S.q.delete(SQ[i]):S.q.add(SQ[i]);renderScatter();},quotaMain(SQ),'Other Quotas',false);
  gchips($('s-c'),SC,i=>S.c.has(SC[i]),i=>{S.c.has(SC[i])?S.c.delete(SC[i]):S.c.add(SC[i]);renderScatter();},catMain(SC),'PwD',false);
  buildScatterCourses();renderScatter();
}
function buildScatterCourses(){
  const L=courseIdsOf(S.type);
  chips($('s-courses'),L.map(x=>x.c.n),j=>S.sel.has(ckey(L[j].c)),j=>{const k=ckey(L[j].c);S.sel.has(k)?S.sel.delete(k):S.sel.add(k);renderScatter();});
}
function renderScatter(){
  if(!DS||$('v-scatter').hidden)return;
  const ds=DS;
  $('s-qc').textContent=S.q.size+' selected';$('s-cc').textContent=S.c.size+' selected';
  const L=courseIdsOf(S.type);
  $('s-sc').textContent=L.filter(x=>S.sel.has(ckey(x.c))).length+' / '+L.length+' selected';
  const card=$('chartcard'),box=$('plotbox'),tip=$('tip');tip.classList.remove('on');
  const qs=idxSet(S.q,ds.quotas),cs=idxSet(S.c,ds.cats);
  const sel=L.filter(x=>S.sel.has(ckey(x.c)));
  if(!qs.size||!cs.size||!sel.length){card.hidden=true;box.innerHTML='';return;}
  card.hidden=false;
  const qn=[...qs].map(i=>ds.quotas[i]).sort(cmp),cn=[...cs].map(i=>ds.cats[i]).sort(cmp);
  $('c-title').textContent='Closing rank by speciality · '+(S.type==='M'?'MD / MS / DNB':'Diploma');
  $('c-sub').textContent=qn.join(', ')+'  ×  '+cn.join(', ');
  const pts=[],none=[];
  for(const {c,i} of sel){const r=closing(i,qs,cs);r?pts.push({name:c.n,max:r.max,cnt:r.cnt}):none.push(c.n);}
  $('c-note').textContent=none.length?'No allotments for these filters: '+none.join(', '):'';
  if(!pts.length){box.innerHTML='<div class="nodata">No Data Available</div>';return;}
  if(S.sort==='asc')pts.sort((a,b)=>a.max-b.max||a.name.localeCompare(b.name));
  else if(S.sort==='desc')pts.sort((a,b)=>b.max-a.max||a.name.localeCompare(b.name));
  else pts.sort((a,b)=>a.name.localeCompare(b.name));
  box.innerHTML='<svg id="plot" role="img" aria-label="Closing rank by speciality"></svg>';
  const sv=$('plot');
  const W=Math.max(300,box.clientWidth||900),narrow=W<560;
  const rowH=narrow?30:28,mt=14,mb=44,ml=narrow?Math.round(W*.4):Math.min(300,Math.round(W*.27)),mr=narrow?48:66;
  const H=mt+mb+pts.length*rowH;
  sv.setAttribute('viewBox',`0 0 ${W} ${H}`);sv.setAttribute('width',W);sv.setAttribute('height',H);sv.style.height=H+'px';
  const xmax=niceMax(Math.max(...pts.map(p=>p.max))*1.02),step=niceStep(xmax,narrow?4:8);
  const x=v=>ml+(v/xmax)*(W-ml-mr);
  for(let v=0;v<=xmax+1e-9;v+=step){
    el('line',{x1:x(v),x2:x(v),y1:mt-4,y2:H-mb+4,stroke:'#262626'},sv);
    const t=el('text',{x:x(v),y:H-mb+22,'text-anchor':'middle',fill:'#8a8a8a','font-size':11},sv);t.textContent=kfmt(Math.round(v));
  }
  const at=el('text',{x:ml+(W-ml-mr)/2,y:H-8,'text-anchor':'middle',fill:'#a3a3a3','font-size':11.5,'font-weight':700,'letter-spacing':'.08em'},sv);
  at.textContent=narrow?'CANDIDATE RANK':'CANDIDATE RANK  (closing rank)';
  el('line',{x1:ml,x2:W-mr,y1:H-mb+4,y2:H-mb+4,stroke:'#555'},sv);
  const maxChars=Math.floor((ml-16)/(narrow?7.6:8.2));
  pts.forEach((p,k)=>{
    const cy=mt+k*rowH+rowH/2,cx=x(p.max);
    const row=el('g',{tabindex:0,role:'img','aria-label':`${p.name}: closing rank ${fmt(p.max)}`},sv);row.style.outline='none';
    const hl=el('rect',{x:0,y:cy-rowH/2,width:W,height:rowH,fill:'#fff','fill-opacity':0},row);
    el('line',{x1:ml,x2:cx,y1:cy,y2:cy,stroke:'#3a3a3a','stroke-width':1.2,'stroke-dasharray':'2 3'},row);
    const lbl=el('text',{x:ml-10,y:cy+4,'text-anchor':'end',fill:'#d6d6d6','font-size':narrow?11:12.5,'font-weight':600},row);
    lbl.textContent=p.name.length>maxChars?p.name.slice(0,maxChars-1)+'…':p.name;
    const glow=el('circle',{cx,cy,r:11,fill:'#e50914','fill-opacity':0},row);
    const dot=el('circle',{cx,cy,r:6.5,fill:'#e50914',stroke:'#fff','stroke-width':1.6},row);
    const val=el('text',{x:cx+13,y:cy+4,fill:'#f5f5f1','font-size':11.5,'font-weight':800},row);val.textContent=fmt(p.max);
    if(cx+13+val.getComputedTextLength()>W-4){val.setAttribute('x',cx-13);val.setAttribute('text-anchor','end');}
    const on=()=>{hl.setAttribute('fill-opacity',.06);glow.setAttribute('fill-opacity',.3);dot.setAttribute('r',8);
      tip.innerHTML=`<div class="n">${esc(p.name)}</div><div class="r">${fmt(p.max)}</div><div class="m">Quota: ${esc(qn.join(', '))}<br>Category: ${esc(cn.join(', '))}</div>`;
      const cr=card.getBoundingClientRect(),br=box.getBoundingClientRect();
      const tw=Math.min(300,cr.width-16);tip.style.maxWidth=tw+'px';
      let left=br.left-cr.left+cx+18;if(left+tw>cr.width-8)left=br.left-cr.left+cx-tw-18;if(left<8)left=8;
      tip.style.left=left+'px';
      const th=tip.offsetHeight||110;let top=br.top-cr.top+cy-th/2;top=Math.max(40,Math.min(top,cr.height-th-8));tip.style.top=top+'px';
      tip.classList.add('on');};
    const off=()=>{hl.setAttribute('fill-opacity',0);glow.setAttribute('fill-opacity',0);dot.setAttribute('r',6.5);tip.classList.remove('on');};
    row.addEventListener('mouseenter',on);row.addEventListener('mouseleave',off);
    row.addEventListener('focus',on);row.addEventListener('blur',off);row.addEventListener('touchstart',on,{passive:true});
  });
}
$('s-type').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.type=b.dataset.v;
  [...$('s-type').children].forEach(x=>x.setAttribute('aria-pressed',x===b));buildScatterCourses();renderScatter();};
$('c-sort').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.sort=b.dataset.v;
  [...$('c-sort').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderScatter();};

/* ================= bulk buttons ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!DS)return;
  const [v,w,m]=b.dataset.a.split('-'),on=m==='all',ds=DS;
  const setAll=(set,arr)=>{on?arr.forEach(x=>set.add(x)):arr.forEach(x=>set.delete(x));};
  if(v==='t'){
    if(w==='q')setAll(T.q,ds.quotas);else if(w==='c')setAll(T.c,ds.cats);
    else setAll(T.courses,courseIdsOf(w==='m'?'M':'D',true).map(x=>ckey(x.c)));
    buildCutoff();
  }else{
    if(w==='q')setAll(S.q,ds.quotas);else if(w==='c')setAll(S.c,ds.cats);
    else setAll(S.sel,courseIdsOf(S.type).map(x=>ckey(x.c)));
    buildScatter();
  }
});

/* ================= contact ================= */
function closeContact(){$('cpop').hidden=true;$('contactbtn').setAttribute('aria-expanded','false');}
$('contactbtn').onclick=()=>{
  const open=$('cpop').hidden;closeContact();
  if(open){const p=$('cpop');p.hidden=false;$('contactbtn').setAttribute('aria-expanded','true');p.style.left='';p.style.right='';
    const r=p.getBoundingClientRect();if(r.right>innerWidth-12){p.style.left='auto';p.style.right='0';}}
};
document.addEventListener('click',e=>{if(!e.target.closest('.cwrap'))closeContact();});

/* ================= views ================= */
let view='cutoff';
function show(v){
  view=v;
  $('v-cutoff').hidden=v!=='cutoff';$('v-scatter').hidden=v!=='scatter';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));
  if(DS){v==='cutoff'?renderCutoff():renderScatter();}
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.v);};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderScatter,120);});

/* ================= counselling rounds (each round = its own CSV file, loaded when the page opens) ================= */
const ROUNDS=[{n:1,label:'Round 1',url:'r1.csv'}];
const CACHE=new Map();            // round number -> its own parsed dataset (never merged)
let current=null;
function say(kind,main){const m=$('msg');m.hidden=false;m.className='msg '+kind;m.textContent=main;}
async function loadRound(r){
  if(!CACHE.has(r.n)){
    let resp;
    try{resp=await fetch(r.url,{cache:'no-cache'});}   // revalidates with the server, so a newer file is used on reload
    catch(e){throw new Error('could not download '+r.url+'. Check your connection; also note this page must be opened from a web server (e.g. GitHub Pages), not directly from a local file.');}
    if(!resp.ok)throw new Error('could not download '+r.url+' (HTTP '+resp.status+'). Make sure it sits next to this page.');
    const text=await resp.text();
    if(!text.trim())throw new Error(r.url+' is empty.');
    const ds=buildDataset(parseCSV(text),r.label);
    CACHE.set(r.n,ds);
    const skipped=ds.skippedRank+ds.skippedField;
    if(skipped)console.warn(r.label+': '+skipped+' row(s) could not be used');
    if(ds.unknown.length)console.warn(r.label+': course names outside the known list:',ds.unknown);
  }
  return CACHE.get(r.n);
}
async function selectRound(r){
  let ds;
  if(!CACHE.has(r.n))say('','Loading '+r.label+' data…');
  try{ds=await loadRound(r);}catch(err){say('err',r.label+' could not be loaded — '+err.message);return false;}
  DS=ds;current=r;
  $('msg').hidden=true;
  const skipped=ds.skippedRank+ds.skippedField;
  if(skipped)say('err',`${r.label}: ${fmt(skipped)} row(s) in the source data could not be used (invalid Rank or missing Quota/Category/Course).`);
  $('h-round').textContent=r.label;
  document.querySelectorAll('.rbtn').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.n)===r.n));
  // keep earlier selections that still exist in this round
  const keep=(set,arr)=>{for(const v of [...set])if(!arr.includes(v))set.delete(v);};
  keep(T.q,ds.quotas);keep(T.c,ds.cats);keep(S.q,ds.quotas);keep(S.c,ds.cats);
  keep(T.courses,ds.mcourses.map(ckey));keep(S.sel,ds.courses.map(ckey));
  if(first){
    const aq=ds.quotas.includes('All India')?'All India':sortNames(ds.quotas)[0],ac=ds.cats.includes('Open')?'Open':sortNames(ds.cats)[0];
    T.q.add(aq);T.c.add(ac);S.q.add(aq);S.c.add(ac);
    ds.courses.forEach(c=>{if(c.t==='M')S.sel.add(ckey(c));});
    first=false;
  }
  buildCutoff();buildScatter();show(view);
  return true;
}
(function init(){
  const bar=$('rbtns');
  ROUNDS.forEach(r=>{
    const b=document.createElement('button');b.type='button';b.className='rbtn';b.textContent=r.label;b.dataset.n=r.n;
    b.setAttribute('aria-pressed','false');b.onclick=()=>{if(current!==r)selectRound(r);};
    bar.appendChild(b);
  });
  selectRound(ROUNDS[0]);
})();

})();
</script>
